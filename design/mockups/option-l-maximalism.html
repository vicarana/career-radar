<!DOCTYPE html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>L - Maximalism</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff23d;min-height:100vh;font:15px/1.4 -apple-system,system-ui,sans-serif;padding:20px 16px;overflow-x:hidden}
.wrap{max-width:400px;margin:0 auto;position:relative}
.hero{background:#111;color:#fff23d;padding:20px;border-radius:6px;transform:rotate(-2deg);margin-bottom:24px;
  box-shadow:8px 8px 0 #ff2e93}
.hero h1{font-size:26px;font-weight:900;text-transform:uppercase}
.job{padding:18px;border-radius:6px;margin-bottom:20px;position:relative}
.job:nth-child(odd){background:#ff2e93;color:#fff;transform:rotate(1.5deg)}
.job:nth-child(even){background:#00e0d3;color:#111;transform:rotate(-1.5deg)}
.job-title{font-size:18px;font-weight:900}
.job-co{font-size:12px;font-weight:700;margin-top:2px}
.blob{position:absolute;width:60px;height:60px;background:#6d5bff;border-radius:50%;top:-16px;right:-10px;
  display:grid;place-items:center;font-weight:900;color:#fff;font-size:12px;transform:rotate(12deg)}
</style></head><body><div class="wrap">
<div class="hero"><h1>Career Radar!!</h1></div>
<div class="job"><div class="blob">76%</div><div class="job-title">STAFF SRE</div><div class="job-co">REPLIT / REMOTE</div></div>
<div class="job"><div class="blob">71%</div><div class="job-title">SENIOR SRE</div><div class="job-co">REPLIT / REMOTE</div></div>
</div></body></html>
