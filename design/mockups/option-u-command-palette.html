<!DOCTYPE html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>U - Command Palette</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0d12;color:#e8eaf0;min-height:100vh;font:15px/1.5 -apple-system,system-ui,sans-serif;padding:24px 16px}
.wrap{max-width:400px;margin:0 auto;text-align:center;padding-top:60px}
h1{font-size:18px;font-weight:700;color:#6a7180;margin-bottom:10px}
.hint{font-size:13px;color:#4a4f5c;margin-bottom:24px}
.trigger{display:inline-block;background:#171a21;border:1px solid #262b36;border-radius:10px;padding:10px 18px;
  font-size:13px;color:#8a93a3;cursor:pointer}
kbd{background:#262b36;padding:2px 6px;border-radius:4px;font-size:11px;margin-left:6px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;
  justify-content:center;padding-top:80px}
.overlay.open{display:flex}
.palette{background:#151821;border:1px solid #2a3040;border-radius:16px;width:340px;
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
.palette input{width:100%;padding:16px;background:transparent;border:none;border-bottom:1px solid #2a3040;
  color:#fff;font-size:15px;outline:none}
.result{padding:12px 16px;text-align:left;font-size:14px;border-bottom:1px solid #1c2029}
.result b{color:#38bdf8}
.result-meta{font-size:11px;color:#6a7180;margin-top:2px}
</style></head><body><div class="wrap">
<h1>Career Radar</h1>
<div class="hint">Command-palette first navigation</div>
<div class="trigger" onclick="document.getElementById('ov').classList.add('open')">Search jobs, actions... <kbd>Cmd K</kbd></div>
</div>
<div class="overlay" id="ov" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="palette">
    <input placeholder="Type a role, company, or action..." autofocus>
    <div class="result"><b>Staff Site Reliability Engineer</b><div class="result-meta">Replit · Remote · 76%</div></div>
    <div class="result"><b>Senior SRE</b><div class="result-meta">Replit · Remote · 71%</div></div>
    <div class="result">Open Match JD tab</div>
  </div>
</div>
</body></html>
