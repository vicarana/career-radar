<!DOCTYPE html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>S - 3D Isometric Icons</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f2f4fb;color:#1a1d2e;min-height:100vh;font:15px/1.5 -apple-system,system-ui,sans-serif;padding:24px 16px}
.wrap{max-width:400px;margin:0 auto}
h1{font-size:20px;font-weight:800;margin-bottom:16px}
.icon{width:52px;height:52px;border-radius:16px;flex:0 0 52px;
  background:radial-gradient(circle at 30% 25%,#a5b4fc,#6366f1 70%);
  box-shadow:0 8px 16px rgba(99,102,241,.35),inset 0 -6px 8px rgba(0,0,0,.15),inset 0 4px 6px rgba(255,255,255,.4)}
.icon.green{background:radial-gradient(circle at 30% 25%,#86efac,#22c55e 70%);box-shadow:0 8px 16px rgba(34,197,94,.35),inset 0 -6px 8px rgba(0,0,0,.15),inset 0 4px 6px rgba(255,255,255,.4)}
.job{display:flex;gap:14px;align-items:center;background:#fff;border-radius:20px;padding:16px;margin-bottom:14px;
  box-shadow:0 6px 20px rgba(30,40,90,.08)}
.job-title{font-weight:800;font-size:15px}
.job-co{font-size:12px;color:#7a7d94;margin-top:2px}
</style></head><body><div class="wrap">
<h1>Career Radar</h1>
<div class="job"><div class="icon"></div><div><div class="job-title">Staff Site Reliability Engineer</div><div class="job-co">Replit · Remote · 76%</div></div></div>
<div class="job"><div class="icon green"></div><div><div class="job-title">Senior SRE</div><div class="job-co">Replit · Remote · 71%</div></div></div>
<p style="font-size:11px;color:#9a9db0;margin-top:8px">Note: real 3D illustration needs actual rendered assets (Blender/Spline export), this approximates the look with CSS gradients only.</p>
</div></body></html>
