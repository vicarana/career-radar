<!DOCTYPE html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>I - Neumorphism</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e4e9f0;min-height:100vh;font:15px/1.5 -apple-system,system-ui,sans-serif;color:#3a4356;padding:20px 16px}
.wrap{max-width:400px;margin:0 auto}
.soft{background:#e4e9f0;border-radius:20px;box-shadow:8px 8px 16px #c3c9d4,-8px -8px 16px #ffffff}
.soft.pressed{box-shadow:inset 5px 5px 10px #c3c9d4,inset -5px -5px 10px #ffffff}
.hero{padding:20px;margin-bottom:16px}
.hero h1{font-size:22px;font-weight:700}
.hero .sub{font-size:12px;color:#7a8399;margin-top:4px}
.stats{display:flex;gap:12px;margin-bottom:16px}
.stat{flex:1;padding:14px;text-align:center}
.stat .n{font-size:22px;font-weight:800}
.stat .l{font-size:10px;color:#7a8399;margin-top:2px}
.job{padding:16px;margin-bottom:14px}
.job-title{font-weight:700;font-size:15px}
.job-co{font-size:12px;color:#7a8399;margin:2px 0 10px}
.cta{display:flex;gap:8px}
.btn{flex:1;text-align:center;font-size:12px;font-weight:700;padding:10px;border-radius:14px;color:#5b6cff}
</style></head><body><div class="wrap">
<div class="soft hero"><h1>Career Radar</h1><div class="sub">Neumorphism / Soft UI</div></div>
<div class="stats"><div class="soft pressed stat"><div class="n">44</div><div class="l">TOTAL</div></div>
<div class="soft pressed stat"><div class="n">4</div><div class="l">B-GRADE</div></div></div>
<div class="soft job"><div class="job-title">Staff Site Reliability Engineer</div><div class="job-co">Replit · Remote</div>
<div class="cta"><span class="soft btn">Open</span><span class="soft btn">Tailor CV</span></div></div>
<div class="soft job"><div class="job-title">Senior SRE</div><div class="job-co">Replit · Remote</div>
<div class="cta"><span class="soft btn">Open</span><span class="soft btn">Tailor CV</span></div></div>
<p style="font-size:11px;color:#a3adc2;margin-top:8px">Note: low contrast by nature, would need a darker accent to pass WCAG AA.</p>
</div></body></html>
