<!DOCTYPE html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Q - Variable Expressive Type</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fdfcf9;color:#141414;min-height:100vh;font:16px/1.6 Georgia,serif;padding:36px 22px}
.wrap{max-width:420px;margin:0 auto}
.eyebrow{font-family:-apple-system,sans-serif;font-size:11px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:#b3a68a}
h1{font-size:44px;font-weight:400;line-height:1.05;margin:8px 0 30px;letter-spacing:-.01em}
.job{padding:22px 0;border-top:1px solid #e8e3d8}
.job-title{font-size:22px;font-weight:400}
.job-meta{font-family:-apple-system,sans-serif;font-size:11px;color:#9a9082;text-transform:uppercase;
  letter-spacing:.06em;margin-top:6px}
.job-note{font-size:14px;color:#5a5548;margin-top:8px;font-style:italic}
</style></head><body><div class="wrap">
<div class="eyebrow">Career Radar</div>
<h1>Four roles<br>deserve a<br>closer look.</h1>
<div class="job"><div class="job-title">Staff Site Reliability Engineer</div><div class="job-meta">Replit — Remote — 76%</div>
<div class="job-note">Strong alignment on Kubernetes and observability.</div></div>
<div class="job"><div class="job-title">Senior SRE</div><div class="job-meta">Replit — Remote — 71%</div>
<div class="job-note">Terraform-heavy, a comfortable fit.</div></div>
</div></body></html>
