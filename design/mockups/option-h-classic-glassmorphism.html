<!DOCTYPE html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>H - Classic Glassmorphism</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(135deg,#7b5bff,#4f9bff 50%,#38d9c9);min-height:100vh;
  font:15px/1.5 -apple-system,system-ui,sans-serif;color:#fff;padding:20px 16px}
.wrap{max-width:400px;margin:0 auto}
.glass{background:rgba(255,255,255,.22);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.35);
  border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.hero{padding:20px;margin-bottom:14px}
.hero h1{font-size:22px;font-weight:800}
.hero .sub{font-size:12px;opacity:.85;margin-top:4px}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
.tab{flex:0 0 auto;font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3)}
.tab.on{background:#fff;color:#4f46e5}
.job{padding:16px;margin-bottom:12px}
.job-title{font-weight:800;font-size:15px}
.job-co{font-size:12px;opacity:.85;margin:2px 0 8px}
.chip{font-size:10px;background:rgba(255,255,255,.2);padding:3px 9px;border-radius:999px;margin-right:5px}
.cta{margin-top:10px;display:flex;gap:8px}
.btn{flex:1;text-align:center;font-size:12px;font-weight:800;padding:9px;border-radius:12px;
  background:rgba(255,255,255,.9);color:#4f46e5}
</style></head><body><div class="wrap">
<div class="glass hero"><h1>Career Radar</h1><div class="sub">Classic Glassmorphism</div></div>
<div class="tabs"><span class="tab on">Dashboard</span><span class="tab">Europe</span><span class="tab">Remote</span></div>
<div class="glass job"><div class="job-title">Staff Site Reliability Engineer</div><div class="job-co">Replit · Remote</div>
<span class="chip">Kubernetes</span><span class="chip">Observability</span><div class="cta"><span class="btn">Open</span><span class="btn">Tailor CV</span></div></div>
<div class="glass job"><div class="job-title">Senior SRE</div><div class="job-co">Replit · Remote</div>
<span class="chip">Terraform</span><div class="cta"><span class="btn">Open</span><span class="btn">Tailor CV</span></div></div>
</div></body></html>
