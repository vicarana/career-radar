<!DOCTYPE html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>R - Monochrome Single Accent</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0f;color:#e8e8ec;min-height:100vh;font:15px/1.5 -apple-system,system-ui,sans-serif;padding:24px 16px}
.wrap{max-width:400px;margin:0 auto}
h1{font-size:20px;font-weight:700;margin-bottom:4px}
.sub{font-size:12px;color:#6f6f78;margin-bottom:20px}
.stats{display:flex;gap:10px;margin-bottom:18px}
.stat{flex:1;background:#18181c;border:1px solid #262629;border-radius:12px;padding:14px;text-align:center}
.stat .n{font-size:20px;font-weight:800;color:#fff}
.stat.accent .n{color:#c6ff3d}
.stat .l{font-size:10px;color:#6f6f78;margin-top:2px}
.job{background:#18181c;border:1px solid #262629;border-radius:14px;padding:16px;margin-bottom:12px}
.job-title{font-weight:700;font-size:15px}
.job-co{font-size:12px;color:#6f6f78;margin:4px 0 10px}
.btn{display:inline-block;background:#c6ff3d;color:#0d0d0f;font-size:12px;font-weight:800;padding:8px 16px;border-radius:8px}
</style></head><body><div class="wrap">
<h1>Career Radar</h1><div class="sub">Monochrome + single accent</div>
<div class="stats"><div class="stat"><div class="n">44</div><div class="l">TOTAL</div></div>
<div class="stat accent"><div class="n">4</div><div class="l">B-GRADE</div></div></div>
<div class="job"><div class="job-title">Staff Site Reliability Engineer</div><div class="job-co">Replit · Remote · 76%</div><span class="btn">Open</span></div>
<div class="job"><div class="job-title">Senior SRE</div><div class="job-co">Replit · Remote · 71%</div><span class="btn">Open</span></div>
</div></body></html>
