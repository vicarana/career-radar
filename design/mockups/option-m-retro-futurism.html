<!DOCTYPE html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>M - Retro Futurism Y2K</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at 30% 0%,#2d0a4e,#0a0420 60%);min-height:100vh;color:#fff;
  font:15px/1.5 'Trebuchet MS',sans-serif;padding:24px 16px}
.wrap{max-width:400px;margin:0 auto}
h1{font-size:30px;font-weight:900;text-align:center;
  background:linear-gradient(180deg,#fff,#ff6ec7 60%,#8b5cf6);-webkit-background-clip:text;
  background-clip:text;color:transparent;text-shadow:0 2px 12px rgba(255,110,199,.5);margin-bottom:20px}
.job{background:linear-gradient(135deg,#3d1a6b,#1a0a33);border:1px solid #7b3fe4;border-radius:24px;
  padding:18px;margin-bottom:16px;box-shadow:0 0 24px rgba(139,92,246,.35)}
.job-title{font-size:16px;font-weight:800;color:#fff}
.job-co{font-size:12px;color:#c9a8ff;margin:4px 0 10px}
.pct{display:inline-block;background:linear-gradient(90deg,#ff6ec7,#8b5cf6);padding:5px 14px;
  border-radius:999px;font-size:12px;font-weight:800}
</style></head><body><div class="wrap">
<h1>CAREER RADAR</h1>
<div class="job"><div class="job-title">Staff Site Reliability Engineer</div><div class="job-co">Replit · Remote</div><span class="pct">76% MATCH</span></div>
<div class="job"><div class="job-title">Senior SRE</div><div class="job-co">Replit · Remote</div><span class="pct">71% MATCH</span></div>
</div></body></html>
