<!DOCTYPE html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>T - Skeuomorphic Tactile Realism</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e9e2d3;color:#2b2418;min-height:100vh;font:15px/1.5 Georgia,serif;padding:24px 16px}
.wrap{max-width:400px;margin:0 auto}
h1{font-size:22px;font-weight:700;margin-bottom:16px;font-family:-apple-system,sans-serif}
.card{background:#fffdf7;border-radius:8px;padding:18px;margin-bottom:16px;
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 10px 20px rgba(60,45,20,.15),0 2px 4px rgba(60,45,20,.1);
  border:1px solid #d8cfb8;position:relative}
.card::before{content:'';position:absolute;top:0;left:16px;right:16px;height:1px;background:rgba(0,0,0,.05)}
.job-title{font-weight:700;font-size:16px}
.job-co{font-size:12px;color:#8a7f66;margin:4px 0 10px;font-family:-apple-system,sans-serif}
.btn{font-family:-apple-system,sans-serif;display:inline-block;background:linear-gradient(180deg,#5c4a2e,#3e3018);
  color:#fff2d9;font-size:12px;font-weight:700;padding:9px 16px;border-radius:6px;
  box-shadow:0 2px 0 #241c0d,0 4px 6px rgba(0,0,0,.2)}
</style></head><body><div class="wrap">
<h1>Career Radar</h1>
<div class="card"><div class="job-title">Staff Site Reliability Engineer</div><div class="job-co">Replit · Remote · 76% match</div><span class="btn">Open Posting</span></div>
<div class="card"><div class="job-title">Senior SRE</div><div class="job-co">Replit · Remote · 71% match</div><span class="btn">Open Posting</span></div>
</div></body></html>
