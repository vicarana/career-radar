<!DOCTYPE html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>N - Claymorphism</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#ffe8d6;min-height:100vh;font:15px/1.5 -apple-system,system-ui,sans-serif;color:#5c3d2e;padding:24px 16px}
.wrap{max-width:400px;margin:0 auto}
.clay{background:#fff2e6;border-radius:32px;box-shadow:8px 8px 0 rgba(92,61,46,.12),inset 0 -6px 0 rgba(92,61,46,.06)}
.hero{padding:22px;margin-bottom:18px;background:#ffd4a3}
.hero h1{font-size:24px;font-weight:800}
.hero .sub{font-size:12px;margin-top:4px;color:#8a5f45}
.stats{display:flex;gap:12px;margin-bottom:18px}
.stat{flex:1;padding:16px;text-align:center;background:#c7f0d8}
.stat .n{font-size:24px;font-weight:800}
.job{padding:18px;margin-bottom:16px}
.job-title{font-weight:800;font-size:15px}
.job-co{font-size:12px;color:#8a5f45;margin:4px 0 10px}
.btn{display:inline-block;background:#ffb4a2;padding:8px 16px;border-radius:999px;font-size:12px;font-weight:800;
  box-shadow:3px 3px 0 rgba(92,61,46,.15)}
</style></head><body><div class="wrap">
<div class="clay hero"><h1>Career Radar</h1><div class="sub">Claymorphism</div></div>
<div class="stats"><div class="clay stat"><div class="n">44</div></div><div class="clay stat" style="background:#ffd4a3"><div class="n">4</div></div></div>
<div class="clay job"><div class="job-title">Staff Site Reliability Engineer</div><div class="job-co">Replit · Remote</div><span class="btn">Open Job</span></div>
<div class="clay job"><div class="job-title">Senior SRE</div><div class="job-co">Replit · Remote</div><span class="btn">Open Job</span></div>
</div></body></html>
