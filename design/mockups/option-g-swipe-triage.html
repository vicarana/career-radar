<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Option G - Swipe to Triage</title>
<style>
:root{--bg:#0f1115;--ink:#fff;--dim:#8a93a3;--a:#22c55e;--r:#ef4444;--b:#38bdf8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,system-ui,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
.top{text-align:center;margin-bottom:20px}
.top h1{font-size:20px;font-weight:800}
.top .sub{font-size:12px;color:var(--dim);margin-top:4px}

.stack{position:relative;width:100%;max-width:340px;height:440px}
.card{position:absolute;inset:0;border-radius:28px;padding:24px;display:flex;flex-direction:column;
  justify-content:space-between;cursor:grab;transition:transform .25s,opacity .25s}
.card:active{cursor:grabbing}
.card.c0{background:linear-gradient(160deg,#1e293b,#0f172a);border:1px solid #2b3a56;z-index:3}
.card.c1{background:linear-gradient(160deg,#182233,#0d1420);z-index:2;transform:scale(.95) translateY(14px)}
.card.c2{background:linear-gradient(160deg,#131b28,#0a0f18);z-index:1;transform:scale(.9) translateY(26px)}
.grade{align-self:flex-start;font-size:12px;font-weight:800;background:var(--b);color:#04132f;
  padding:4px 12px;border-radius:999px}
.card h2{font-size:24px;font-weight:800;margin-top:16px}
.card .co{color:var(--dim);font-size:13px;margin-top:4px}
.tags{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;background:rgba(255,255,255,.08);padding:4px 10px;border-radius:999px;color:var(--dim)}
.match{font-size:13px;color:var(--dim)}
.match b{color:#fff;font-size:20px}

.overlay{position:absolute;top:24px;font-size:22px;font-weight:900;padding:8px 18px;border-radius:10px;
  transform:rotate(-12deg);opacity:0;pointer-events:none;border:3px solid}
.overlay.skip{left:20px;color:var(--r);border-color:var(--r)}
.overlay.save{right:20px;color:var(--a);border-color:var(--a);transform:rotate(12deg)}

.actions{display:flex;gap:20px;margin-top:28px}
.act{width:56px;height:56px;border-radius:50%;border:none;display:grid;place-items:center;font-size:22px;
  cursor:pointer}
.act.skip{background:#2a1418;color:var(--r)}
.act.save{background:#12281a;color:var(--a)}
.act.info{background:#1b2333;color:var(--b);width:44px;height:44px;font-size:16px}

.progress{display:flex;gap:5px;margin-top:20px}
.progress span{width:24px;height:3px;border-radius:2px;background:#2a3346}
.progress span.done{background:var(--b)}
</style>
</head>
<body>
<div class="top"><h1>Career Radar</h1><div class="sub">Swipe right to save, left to skip</div></div>
<div class="stack" id="stack">
  <div class="card c2">
    <span class="grade">C · 55%</span>
    <div><h2>Backend Engineer, AI</h2><div class="co">GitLab · Anywhere</div></div>
  </div>
  <div class="card c1">
    <span class="grade">B · 71%</span>
    <div><h2>Senior SRE</h2><div class="co">Replit · Remote</div></div>
  </div>
  <div class="card c0" id="top-card">
    <span class="grade">B · 76%</span>
    <div>
      <h2>Staff Site Reliability Engineer</h2>
      <div class="co">Replit · Remote</div>
      <div class="tags"><span class="tag">Kubernetes</span><span class="tag">Observability</span><span class="tag">Terraform</span></div>
    </div>
    <div class="match">Match score <b>76%</b></div>
    <div class="overlay skip" id="ov-skip">SKIP</div>
    <div class="overlay save" id="ov-save">SAVE</div>
  </div>
</div>
<div class="actions">
  <button class="act skip" onclick="decide(-1)">&#10005;</button>
  <button class="act info">i</button>
  <button class="act save" onclick="decide(1)">&#9825;</button>
</div>
<div class="progress">
  <span class="done"></span><span></span><span></span><span></span>
</div>
<script>
const top=document.getElementById('top-card');
const ovSkip=document.getElementById('ov-skip'), ovSave=document.getElementById('ov-save');
let startX=0,dx=0,dragging=false;
function onDown(e){dragging=true;startX=(e.touches?e.touches[0].clientX:e.clientX)}
function onMove(e){
  if(!dragging)return;
  const x=(e.touches?e.touches[0].clientX:e.clientX);dx=x-startX;
  top.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`;
  ovSkip.style.opacity=Math.max(0,Math.min(1,-dx/80));
  ovSave.style.opacity=Math.max(0,Math.min(1,dx/80));
}
function onUp(){
  if(!dragging)return; dragging=false;
  if(Math.abs(dx)>90){decide(dx>0?1:-1)}
  else{top.style.transform='';ovSkip.style.opacity=0;ovSave.style.opacity=0}
  dx=0;
}
top.addEventListener('mousedown',onDown);window.addEventListener('mousemove',onMove);window.addEventListener('mouseup',onUp);
top.addEventListener('touchstart',onDown);window.addEventListener('touchmove',onMove);window.addEventListener('touchend',onUp);
function decide(dir){
  top.style.transform=`translateX(${dir*500}px) rotate(${dir*30}deg)`;
  top.style.opacity='0';
  setTimeout(()=>{top.style.transition='none';top.style.transform='';top.style.opacity='1';
    setTimeout(()=>top.style.transition='',10)},300);
}
</script>
</body>
</html>
