<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1120" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Career Radar" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Career Radar</title>
<style>
  :root{
    --bg:#0b1120; --card:#141c2e; --card2:#1b263f; --line:#293650;
    --ink:#e8eefc; --dim:#93a4c4; --accent:#5b8cff; --accent2:#22d3ee;
    --a:#22c55e; --b:#38bdf8; --c:#f59e0b; --d:#fb923c; --f:#64748b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 -apple-system,system-ui,Segoe UI,sans-serif;
    padding:0 0 env(safe-area-inset-bottom);}
  .hero{padding:calc(env(safe-area-inset-top) + 20px) 18px 18px;
    background:radial-gradient(120% 120% at 0% 0%, #1e3a8a 0%, #0b1120 55%);
    border-bottom:1px solid var(--line);}
  .hero h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero .sub{color:var(--dim);font-size:13px;margin-top:2px;}
  .hero .meta{display:flex;align-items:center;gap:10px;margin-top:10px;}
  .pill{font-size:12px;color:var(--dim);background:var(--card);border:1px solid var(--line);
    padding:4px 10px;border-radius:999px;}
  .refresh{margin-left:auto;background:var(--accent);border:none;color:#04132f;font-weight:700;
    border-radius:999px;padding:7px 14px;font-size:13px;}
  .tabs{display:flex;gap:7px;padding:12px;overflow-x:auto;position:sticky;top:0;
    background:rgba(11,17,32,.92);backdrop-filter:blur(8px);z-index:5;}
  .tab{flex:0 0 auto;padding:9px 15px;border:1px solid var(--line);border-radius:999px;
    background:var(--card);color:var(--ink);font-weight:600;font-size:14px;}
  .tab[aria-selected="true"]{background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#04132f;border-color:transparent;}
  main{padding:6px 12px 48px;}
  /* dashboard */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;}
  .stat .n{font-size:28px;font-weight:800;line-height:1;}
  .stat .l{color:var(--dim);font-size:12px;margin-top:5px;}
  .stat.big{grid-column:span 2;background:linear-gradient(120deg,#16233d,#101a30);}
  .funnel{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;}
  .funnel h3{margin:0 0 10px;font-size:14px;color:var(--dim);font-weight:600;}
  .bar{height:10px;border-radius:999px;background:var(--card2);overflow:hidden;margin:6px 0;}
  .bar > span{display:block;height:100%;border-radius:999px;}
  .frow{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);}
  /* job cards */
  .job{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:11px 0;
    display:flex;gap:13px;}
  .grade{flex:0 0 46px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
    font-weight:800;font-size:20px;color:#04132f;}
  .g-A{background:var(--a);} .g-B{background:var(--b);} .g-C{background:var(--c);}
  .g-D{background:var(--d);} .g-F{background:var(--f);color:#e8eefc;}
  .job .body{flex:1;min-width:0;}
  .job .title{font-weight:700;font-size:15px;margin:0;}
  .job .co{color:var(--dim);font-size:13px;margin:2px 0 8px;}
  .mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .mbar{flex:1;height:7px;border-radius:999px;background:var(--card2);overflow:hidden;}
  .mbar > span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));}
  .mpct{font-size:12px;color:var(--dim);font-weight:700;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .chip{font-size:11px;color:var(--ink);background:var(--card2);border:1px solid var(--line);
    padding:3px 9px;border-radius:999px;}
  .chip.visa{background:#052e1a;color:#86efac;border-color:#14532d;}
  .cta{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{flex:1;text-align:center;font-size:12.5px;font-weight:700;border-radius:11px;padding:9px 6px;
    border:1px solid var(--line);background:var(--card2);color:var(--ink);text-decoration:none;}
  .btn.primary{background:var(--accent);color:#04132f;border-color:transparent;}
  .link{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin:9px 0;}
  .link a{color:var(--accent2);text-decoration:none;font-weight:600;word-break:break-word;}
  .empty{color:var(--dim);text-align:center;padding:26px 10px;}
  .sample-note{font-size:11px;color:var(--c);text-align:center;padding:6px;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--accent);
    color:#04132f;font-weight:700;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="hero">
  <h1>Career Radar</h1>
  <div class="sub">Tracks B (remote/income) + C (Europe relocation)</div>
  <div class="meta">
    <span class="pill" id="meta">loading...</span>
    <button class="refresh" onclick="load(true)">Refresh</button>
  </div>
</div>
<nav class="tabs" role="tablist">
  <button class="tab" role="tab" data-t="dash" aria-selected="true">Dashboard</button>
  <button class="tab" role="tab" data-t="C" aria-selected="false">Europe</button>
  <button class="tab" role="tab" data-t="B" aria-selected="false">Remote</button>
  <button class="tab" role="tab" data-t="LI" aria-selected="false">LinkedIn</button>
  <button class="tab" role="tab" data-t="WM" aria-selected="false">Walmart</button>
</nav>
<main id="view"><div class="empty">Loading...</div></main>
<div class="toast" id="toast">Copied</div>

<script>
const SAMPLE = { sample:true, stats:{total:3,track_b:1,track_c:2,grade_a:1,grade_b:1,visa:2},
  tracks:{ C:[
    {title:"Site Reliability Engineer",company:"Relex Solutions",location:"Helsinki, Finland",url:"#",grade:"A",match:92,visa:true,reasons:["Title match: sre","Kubernetes","Observability"]},
    {title:"Platform Engineer",company:"Adyen",location:"Amsterdam, Netherlands",url:"#",grade:"B",match:78,visa:true,reasons:["Platform","Terraform","GitOps"]}],
    B:[{title:"DevOps Engineer (Remote)",company:"GitLab",location:"Anywhere",url:"#",grade:"C",match:64,visa:false,reasons:["DevOps","CI/CD","Python"]}]},
  linkedin:[], walmart_markets:[] };

let DATA=null, TAB="dash";
function esc(s){return(s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1400);}
function copyPrompt(kind,j){
  const p = kind==="cv"
    ? `Tailor my CV for this role. Use my resume archetypes in career-assessment/resumes/en/. Role: ${j.title} @ ${j.company} (${j.location}). Keep it truthful - reformulate keywords, never invent. Output an ATS-friendly 1-2 page CV.`
    : `Draft a short, human (no AI-slop) outreach message for this role. Role: ${j.title} @ ${j.company} (${j.location}). Reference why I fit: ${(j.reasons||[]).join(", ")}. 3-4 sentences, warm, specific.`;
  navigator.clipboard.writeText(p).then(()=>toast("Prompt copied - paste in Claude")).catch(()=>toast("Copy failed"));
}
function jobCard(j,i){
  const chips=(j.reasons||[]).map(r=>`<span class="chip">${esc(r)}</span>`).join("")
    + (j.visa?'<span class="chip visa">VISA SPONSOR</span>':'');
  return `<div class="job">
    <div class="grade g-${esc(j.grade||'F')}">${esc(j.grade||'?')}</div>
    <div class="body">
      <p class="title">${esc(j.title)}</p>
      <div class="co">${esc(j.company||'?')} - ${esc(j.location||'n/a')}</div>
      <div class="mrow"><div class="mbar"><span style="width:${j.match||40}%"></span></div><span class="mpct">${j.match||40}%</span></div>
      <div class="chips">${chips}</div>
      <div class="cta">
        <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener">Open</a>
        <button class="btn" onclick='copyPrompt("cv",TRACK[${i}])'>Tailor CV</button>
        <button class="btn" onclick='copyPrompt("out",TRACK[${i}])'>Outreach</button>
      </div>
    </div></div>`;
}
let TRACK=[];
function linkCard(l){return `<div class="link"><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label||l.market)} &rarr;</a></div>`;}

function dashboard(){
  const s=DATA.stats||{total:0,track_b:0,track_c:0,grade_a:0,grade_b:0,visa:0};
  const strong=(s.grade_a||0)+(s.grade_b||0);
  const pct=s.total?Math.round(strong/s.total*100):0;
  return `<div class="grid">
    <div class="stat big"><div class="n">${s.total}</div><div class="l">total matches today</div></div>
    <div class="stat"><div class="n" style="color:var(--a)">${s.grade_a}</div><div class="l">A-grade (apply now)</div></div>
    <div class="stat"><div class="n" style="color:var(--b)">${s.grade_b}</div><div class="l">B-grade (worth it)</div></div>
    <div class="stat"><div class="n" style="color:var(--c)">${s.visa}</div><div class="l">visa-sponsor (C)</div></div>
    <div class="stat"><div class="n">${s.track_c}/${s.track_b}</div><div class="l">Europe / Remote split</div></div>
  </div>
  <div class="funnel"><h3>Strong-match rate</h3>
    <div class="bar"><span style="width:${pct}%;background:linear-gradient(90deg,var(--a),var(--b))"></span></div>
    <div class="frow"><span>${strong} strong (A/B)</span><span>${pct}%</span></div>
  </div>`;
}

function render(){
  const v=document.getElementById("view");
  if(!DATA){v.innerHTML='<div class="empty">No data.</div>';return;}
  const note = DATA.sample ? '<div class="sample-note">Showing SAMPLE data - run the GitHub Action for live jobs</div>' : '';
  if(TAB==="dash"){ v.innerHTML=note+dashboard(); }
  else if(TAB==="C"||TAB==="B"){
    TRACK=(DATA.tracks&&DATA.tracks[TAB])||[];
    v.innerHTML=note+(TRACK.length?TRACK.map(jobCard).join("")
      :'<div class="empty">No matches in this run.<br>Check the LinkedIn tab or trigger the Action.</div>');
  } else if(TAB==="LI"){
    const li=DATA.linkedin||[];
    v.innerHTML=(li.length?'<div class="empty">Open each &amp; tap "Set alert".</div>'+li.map(linkCard).join("")
      :'<div class="empty">LinkedIn searches appear after a live run.</div>');
  } else {
    const wm=(DATA.walmart_markets||[]).map(p=>({label:p.market,url:p.url}));
    v.innerHTML=(wm.length?wm.map(linkCard).join(""):'<div class="empty">Walmart markets appear after a live run.</div>');
  }
}
async function load(force){
  try{
    const r=await fetch("data/latest.json"+(force?"?t="+Date.now():""),{cache:force?"reload":"default"});
    const d=await r.json();
    DATA=(d.stats&&d.stats.total>0)?d:SAMPLE;
    document.getElementById("meta").textContent=(DATA.sample?"sample - ":"")+(d.generated||"")+" - src "+(d.sources_ok||0)+"/4";
  }catch(e){ DATA=SAMPLE; document.getElementById("meta").textContent="offline - sample data"; }
  render();
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected","false"));
  t.setAttribute("aria-selected","true"); TAB=t.dataset.t; render();
}));
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
load();
</script>
</body>
</html>
