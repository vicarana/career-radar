<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0a0f1e"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Career Radar"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>Career Radar</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="shell">
  <nav class="tabbar glass" role="tablist">
    <button class="tab" role="tab" data-t="dash" aria-selected="true">Dashboard</button>
    <button class="tab" role="tab" data-t="C" aria-selected="false">Europe</button>
    <button class="tab" role="tab" data-t="B" aria-selected="false">Remote</button>
    <button class="tab" role="tab" data-t="D" aria-selected="false">US</button>
    <button class="tab" role="tab" data-t="match" aria-selected="false">Match JD</button>
    <button class="tab" role="tab" data-t="saved" aria-selected="false">
      Pipeline<span class="badge" id="saved-badge" style="display:none">0</span>
    </button>
  </nav>
  <div class="content">
    <div class="hero">
      <h1>Career Radar</h1>
      <div class="hero-row">
        <div class="sub">Remote, Europe &amp; US reach, sponsorship not guaranteed, daily</div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="pill" id="meta">loading...</span>
          <button class="refresh-btn" onclick="load(true)">Refresh</button>
        </div>
      </div>
    </div>
    <div class="searchbar glass" id="searchbar">
      <input id="q" oninput="onQuickSearch(this.value)" placeholder="Search roles, companies, skills..."/>
      <button class="clear" onclick="clearQuery()" aria-label="Clear search">&times;</button>
    </div>
    <main id="view"><div class="empty">Loading…</div></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="match.js"></script>
<script src="pipeline.js"></script>
<script src="sprint.js"></script>
<script>
/* ─── Sample data (10 real-looking roles) ─── */

  ],
  walmart_markets: [
    {market:"Walmart Global Tech (US)", url:"https://careers.walmart.com/results?q=site%20reliability"},
    {market:"Walmart GTP – India", url:"https://careers.walmart.com/results?q=SRE&jobCountry=India"},
    {market:"Walmart Technology (all)", url:"https://careers.walmart.com/technology"}
  ],
  profile_lite: {
    target_titles: ["site reliability","sre","devops","platform engineer"],

    avoid_skills: ["wordpress","salesforce developer"]

/* ─── Saved jobs (delegates to pipeline.js for storage) ─── */
function toggleSave(id,jobSnapshot){
  crToggleSaved(id,jobSnapshot); updateSavedBadge(); render();
}
function updateSavedBadge(){
  const n=crPipelineCount(), el=document.getElementById('saved-badge');
  el.textContent=n; el.style.display=n?'inline':'none';
}

/* ─── Helpers ─── */
function esc(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeUrl(u){
  try{ const p=new URL(u,location.href); return (p.protocol==='http:'||p.protocol==='https:')?u:'#'; }
  catch{ return '#'; }
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function copyPrompt(type,j){
  const gapNote=(j.gap&&j.gap.length)?`\nJD asks for these I haven't tagged in my profile yet: ${j.gap.join(', ')}. Address truthfully only where it genuinely applies, never invent experience.`:'';
  const p=type==='cv'
    ?`Tailor my CV for this role using my resume archetypes in career-assessment/resumes/en/.\nRole: ${j.title} at ${j.company}, ${j.location}.${gapNote}\nKeep it truthful – reformulate keywords, never invent. Output ATS-friendly 1–2 page CV.`
    :`Draft a short, human outreach message (no AI-slop).\nRole: ${j.title} at ${j.company}, ${j.location}.\nWhy I fit: ${(j.reasons||[]).join(', ')}.\n3–4 sentences, warm and specific.`;
  navigator.clipboard.writeText(p).then(()=>toast('Prompt copied – paste in Claude')).catch(()=>toast('Copy failed'));
}

let DATA=null, TAB='dash';
let TRACK=[];
let LAST_MATCH=null;
let QUERY='';

/* ─── Quick search (AI-native floating input) ─── */
function onQuickSearch(v){QUERY=v.trim().toLowerCase();render()}
function clearQuery(){QUERY='';const el=document.getElementById('q');if(el)el.value='';render()}
function matchesQuery(j){
  if(!QUERY) return true;
  const hay=[j.title,j.company,j.location,...(j.reasons||[])].join(' ').toLowerCase();
  return hay.includes(QUERY);
}
function allJobs(){return [...((DATA&&DATA.tracks&&DATA.tracks.B)||[]),...((DATA&&DATA.tracks&&DATA.tracks.C)||[]),...((DATA&&DATA.tracks&&DATA.tracks.D)||[])]}

/* ─── Match JD tab ─── */
function resumeCheckHtml(rc){
  if(!rc) return '<div class="job-co" style="opacity:.7">Paste your resume below for a real ATS keyword check (checks literal words in your resume text, not just your profile skill list).</div>';
  const inChips=rc.inResume.map(k=>`<span class="chip">${esc(k)}</span>`).join('')||'<span class="chip">none found</span>';
  const missChips=rc.missing.length?`<div class="section-title">Missing from resume text (add these exact words if truthful)</div><div class="chips">${rc.missing.map(k=>`<span class="chip visa">${esc(k)}</span>`).join('')}</div>`:'';
  return `<div class="section-title">Resume keyword check (the real ATS signal)</div><div class="job-co">${rc.inResume.length} keywords literally in your resume, ${rc.missing.length} missing</div><div class="chips">${inChips}</div>${missChips}`;
}
function matchView(){
  const result=LAST_MATCH?`<div class="job glass" style="margin-top:14px">
      <div class="grade-box g-${esc(LAST_MATCH.grade)}">${esc(LAST_MATCH.grade)}</div>
      <div class="job-body">
        <div class="job-title">Match: ${LAST_MATCH.match}%</div>
        <div class="job-co">${LAST_MATCH.matched.length} keywords matched · ${LAST_MATCH.gap.length} gaps found</div>
        ${resumeCheckHtml(LAST_MATCH.resumeCheck)}
        <div class="section-title">Matched (already in your profile)</div>
        <div class="chips">${LAST_MATCH.matched.map(k=>`<span class="chip">${esc(k)}</span>`).join('')||'<span class="chip">none found</span>'}</div>
        <div class="section-title">Gap (JD wants, not in your profile yet)</div>
        <div class="chips">${LAST_MATCH.gap.map(k=>`<span class="chip visa">${esc(k)}</span>`).join('')||'<span class="chip">no gaps – strong fit</span>'}</div>
        <div class="cta" style="margin-top:10px">
          <button class="btn primary" onclick="copyTailoredPrompt()">Tailor CV (with gaps)</button>
        </div>
      </div>
    </div>`:'';
  return `<div class="section-title">Your resume (stays in this browser only, never sent anywhere)</div>
    <textarea id="resume-text" placeholder="Paste your resume text here once, it's saved locally for future checks" rows="6" class="glass field">${esc(crGetResume())}</textarea>
    <div class="section-title" style="margin-top:14px">Paste a job description</div>
    <textarea id="jd-title" placeholder="Job title (optional)" class="glass field">${LAST_MATCH?esc(LAST_MATCH.title||''):''}</textarea>
    <textarea id="jd-company" placeholder="Company (optional)" class="glass field">${LAST_MATCH?esc(LAST_MATCH.company||''):''}</textarea>
    <textarea id="jd-text" placeholder="Paste the job description here (bookmarklet or manual copy)" rows="8" class="glass field">${LAST_MATCH?esc(LAST_MATCH.rawText||''):''}</textarea>
    <div class="cta" style="margin-top:8px">
      <button class="btn primary" onclick="runJdMatch()">Analyze</button>
    </div>
    ${result}`;
}
function runJdMatch(){
  const rawText=document.getElementById('jd-text').value;
  const title=document.getElementById('jd-title').value;
  const company=document.getElementById('jd-company').value;
  const resumeText=document.getElementById('resume-text').value;
  if(!rawText||!rawText.trim()){toast('Paste a job description first');return}
  crSaveResume(resumeText);
  const profile=(DATA&&DATA.profile_lite)||SAMPLE.profile_lite;
  const r=crAnalyzeJD(rawText,title,company,profile,resumeText);
  LAST_MATCH={...r,title,company,rawText};
  render();
}
function copyTailoredPrompt(){
  if(!LAST_MATCH) return;
  const gap=(LAST_MATCH.resumeCheck&&LAST_MATCH.resumeCheck.missing.length)
    ?LAST_MATCH.resumeCheck.missing
    :LAST_MATCH.gap;
  copyPrompt('cv',{title:LAST_MATCH.title||'this role',company:LAST_MATCH.company||'',
    location:'',gap});
}

/* ─── Dashboard ─── */
function nextAction(s){
  if(!s) return '';
  if((s.grade_a||0)>0) return `<div class="action-card glass">
    <div class="icon" style="color:var(--a)">Apply now</div>
    <div class="label">Recommended action</div>
    <div class="msg">${s.grade_a} A-grade match${s.grade_a>1?'es':''} found. Apply today – open the Europe or Remote tab and use the Tailor CV button.</div>
  </div>`;
  if((s.grade_b||0)>0) return `<div class="action-card glass">
    <div class="icon" style="color:var(--b)">Apply this week</div>
    <div class="label">Recommended action</div>
    <div class="msg">${s.grade_b} B-grade matches worth applying. Check Europe tab first (sponsorship not guaranteed, verify per-role).</div>
  </div>`;
  return `<div class="action-card glass">
    <div class="icon" style="color:var(--dim)">Keep searching</div>
    <div class="label">Today's move</div>
    <div class="msg">No strong matches in this run. Try the search bar above, or re-run the Action on personal WiFi.</div>
  </div>`;
}
function dashboard(){
  const s=DATA.stats||{};
  const strong=(s.grade_a||0)+(s.grade_b||0);
  const pct=s.total?Math.round(strong/s.total*100):0;
  return `
  ${nextAction(s)}
  <div class="section-title">Today's snapshot</div>
  <div class="grid">
    <div class="stat glass wide">
      <div class="n">${s.total}</div>
      <div class="l">total matches scanned</div>
      <div class="mbar-wrap">
        <div class="mbar"><span style="width:${pct}%"></span></div>
        <div class="mbar-row"><span>${strong} strong (A/B grade)</span><span>${pct}%</span></div>
      </div>
    </div>
    <div class="stat glass"><div class="n" style="color:var(--a)">${s.grade_a||0}</div><div class="l">A-grade · apply now</div></div>
    <div class="stat glass"><div class="n" style="color:var(--b)">${s.grade_b||0}</div><div class="l">B-grade · apply this week</div></div>
    <div class="stat glass"><div class="n" style="color:var(--cyan)">${(s.track_c||0)+(s.track_d||0)}</div><div class="l">Europe + US reach (sponsor not guaranteed)</div></div>
    <div class="stat glass"><div class="n" style="color:var(--cyan)">${(s.visa||0)+(s.us_sponsor_confirmed||0)}</div><div class="l">of those, sponsor language confirmed</div></div>
    <div class="stat glass wide"><div class="n">${s.track_c||0}/${s.track_b||0}/${s.track_d||0}</div><div class="l">Europe / Remote / US split</div></div>
  </div>`;
}
function quickLinks(){
  const li=(DATA.linkedin||[]);
  const wm=(DATA.walmart_markets||[]);
  if(!li.length && !wm.length) return '';
  return `<div class="section-title">Quick links</div>`
    + li.map(linkCard).join('') + wm.map(linkCard).join('');
}

/* ─── Job card ─── */
function jobCard(j,i){
  const id=j.title+'|'+j.company;
  const saved=crIsSaved(id);
  const chips=(j.reasons||[]).map(r=>`<span class="chip">${esc(r)}</span>`).join('')
    +(j.visa?'<span class="chip visa">VISA SPONSOR</span>':'')
    +(j.us_sponsor?'<span class="chip us-sponsor">US VISA + RELOCATION</span>':'')
    +(j.comp_disclosed&&j.salary_min?`<span class="chip comp">$${Math.round(j.salary_min/1000)}k+</span>`:'');
  return `<div class="job glass">
    <div class="grade-box g-${esc(j.grade||'F')}">${esc(j.grade||'?')}</div>
    <div class="job-body">
      <div class="job-title">${esc(j.title)}</div>
      <div class="job-co">${esc(j.company)} · ${esc(j.location)}</div>
      <div class="match-row">
        <div class="match-bar"><span style="width:${j.match||40}%"></span></div>
        <span class="match-pct">${j.match||40}%</span>
      </div>
      <div class="chips">${chips}</div>
      <div class="cta">
        <a class="btn primary" href="${esc(safeUrl(j.url))}" target="_blank" rel="noopener">Open</a>
        <button class="btn" onclick='copyPrompt("cv",TRACK[${i}])'>Tailor CV</button>
        <button class="btn" onclick='copyPrompt("out",TRACK[${i}])'>Outreach</button>
        <button class="btn heart ${saved?'on':''}" data-save-idx="${i}">${saved?'Saved':'Save'}</button>
      </div>
    </div>
  </div>`;
}

/* ─── Link / pipeline ─── */
function linkCard(l){return`<div class="link-card glass"><a href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">${esc(l.label||l.market)} &rarr;</a></div>`}
function statusOptions(current){
  return CR_STATUSES.map(s=>`<option value="${s.key}" ${s.key===current?'selected':''}>${esc(s.label)}</option>`).join('');
}
function pipelineCard(id,entry,job){
  const chips=(job.reasons||[]).map(r=>`<span class="chip">${esc(r)}</span>`).join('')
    +(job.visa?'<span class="chip visa">VISA SPONSOR</span>':'')
    +(job.us_sponsor?'<span class="chip us-sponsor">US VISA + RELOCATION</span>':'')
    +(job.comp_disclosed&&job.salary_min?`<span class="chip comp">$${Math.round(job.salary_min/1000)}k+</span>`:'');
  const applied=entry.appliedAt?`<div class="job-co">Applied ${esc(new Date(entry.appliedAt).toLocaleDateString())}</div>`:'';
  return `<div class="job glass">
    <div class="grade-box g-${esc(job.grade||'F')}">${esc(job.grade||'?')}</div>
    <div class="job-body">
      <div class="job-title">${esc(job.title)}</div>
      <div class="job-co">${esc(job.company)} · ${esc(job.location||'')}</div>
      ${applied}
      <div class="chips">${chips}</div>
      <select class="field status-select" data-status-id="${esc(id)}">${statusOptions(entry.status)}</select>
      <textarea class="field note-field" data-note-id="${esc(id)}" placeholder="Notes (recruiter name, next step, salary talk...)">${esc(entry.note||'')}</textarea>
      <div class="cta">
        <a class="btn primary" href="${esc(safeUrl(job.url))}" target="_blank" rel="noopener">Open</a>
        <button class="btn" data-remove-id="${esc(id)}">Remove</button>
      </div>
    </div>
  </div>`;
}
function sprintCardHtml(){
  const cfg=crGetSprint();
  if(!cfg){
    return `<div class="job glass" style="margin-bottom:14px">
      <div class="job-body">
        <div class="job-title">Start a 60-day application sprint</div>
        <div class="job-co">Track daily progress toward a target, against real supply, not guesswork.</div>
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
          <input id="sprint-target" type="number" min="1" max="20" value="5" class="glass field" style="width:80px">
          <select id="sprint-grade" class="glass field" style="width:140px">
            <option value="B" selected>B-grade or better</option>
            <option value="C">C-grade or better</option>
            <option value="D">Any grade (D+)</option>
          </select>
          <button class="btn primary" onclick="doStartSprint()">Start sprint</button>
        </div>
      </div>
    </div>`;
  }
  const prog=crSprintProgress(cfg);
  const supplyToday=crSprintTodaySupply(DATA,cfg.minGrade);
  const pct=Math.min(100,Math.round(prog.appliedTotal/prog.targetTotal*100));
  const paceMsg=prog.onPace
    ?`On pace · ${prog.appliedTotal}/${prog.targetTotal} applied`
    :`Behind pace · need ${prog.requiredPerDay}/day for the rest of the sprint to still hit ${prog.targetTotal}`;
  const supplyMsg=supplyToday<prog.targetPerDay
    ?`<div class="job-co" style="color:var(--c)">Today's real supply at ${esc(cfg.minGrade)}+ grade: only ${supplyToday}, below your ${prog.targetPerDay}/day target. This is a sourcing gap, not something more clicking fixes.</div>`
    :`<div class="job-co">Today's supply at ${esc(cfg.minGrade)}+ grade: ${supplyToday}, enough to hit target if you apply to them.</div>`;
  return `<div class="job glass" style="margin-bottom:14px">
    <div class="job-body">
      <div class="job-title">Sprint: day ${prog.dayIndex} of ${prog.totalDays} (${prog.daysRemaining} left)</div>
      <div class="job-co">Today: ${prog.appliedToday}/${prog.targetPerDay} applied · ${paceMsg}</div>
      <div class="mbar-wrap"><div class="mbar"><span style="width:${pct}%"></span></div></div>
      ${supplyMsg}
      <div class="cta" style="margin-top:8px">
        <button class="btn" onclick="doEndSprint()">End sprint</button>
      </div>
    </div>
  </div>`;
}
function doStartSprint(){
  const target=parseInt(document.getElementById('sprint-target').value,10)||5;
  const grade=document.getElementById('sprint-grade').value||'B';
  crStartSprint(target,grade);
  toast('Sprint started, 60 days, tracked from your Applied status');
  render();
}
function doEndSprint(){
  crEndSprint();
  toast('Sprint ended');
  render();
}
function pipelineView(){
  const p=crGetPipeline();
  const ids=Object.keys(p);
  const hasResume=crGetResume().trim().length>0;
  const stale=crDaysSinceLastExport()>=7;
  const exportBar=(ids.length||hasResume)?`<div class="export-bar glass">
    <span>${stale?'Not archived in 7+ days':'Archive pipeline + resume to MClaude for cross-device history'}</span>
    <button class="btn" id="export-btn">Export</button>
  </div>`:'';
  const liveById={};
  for(const j of allJobs()) liveById[j.title+'|'+j.company]=j;
  let out=sprintCardHtml()+exportBar;
  if(!ids.length) out+='<div class="empty">No tracked jobs yet.<br>Tap Save on any card to start your pipeline.</div>';
  for(const s of CR_STATUSES){
    const inStatus=ids.filter(id=>p[id].status===s.key);
    if(!inStatus.length) continue;
    out+=`<div class="section-title">${esc(s.label)} (${inStatus.length})</div>`;
    out+=inStatus.map(id=>pipelineCard(id,p[id],crResolveJob(id,p[id],liveById))).join('');
  }
  return out;
}

/* ─── Render ─── */
function render(){
  const v=document.getElementById('view');
  const sb=document.getElementById('searchbar');
  if(!DATA){v.innerHTML='<div class="empty">No data.</div>';return}
  sb.style.display=(TAB==='match')?'none':'flex';
  const note=DATA.sample?'<div class="sample-tag">[SAMPLE] run GitHub Action on personal WiFi for live jobs</div>':'';
  if(TAB==='dash'){
    if(QUERY){
      TRACK=allJobs().filter(matchesQuery);
      v.innerHTML=note+`<div class="section-title">Search results for "${esc(QUERY)}"</div>`
        +(TRACK.length?TRACK.map(jobCard).join(''):'<div class="empty">No matches for that search.</div>');
    } else {
      v.innerHTML=note+dashboard()+quickLinks();
    }
  }
  else if(TAB==='C'||TAB==='B'||TAB==='D'){
    TRACK=((DATA.tracks&&DATA.tracks[TAB])||[]).filter(matchesQuery);
    v.innerHTML=note+(TRACK.length?TRACK.map(jobCard).join('')
      :'<div class="empty">No matches here.<br>Try clearing your search, or re-run on personal WiFi.</div>');
  }
  else if(TAB==='match') v.innerHTML=matchView();
  else if(TAB==='saved') v.innerHTML=pipelineView();
  updateSavedBadge();
}

/* ─── Load ─── */
async function load(force){
  try{
    const r=await fetch('data/latest.json'+(force?'?t='+Date.now():''),{cache:force?'reload':'default'});
    const d=await r.json();
    DATA=(d.stats&&d.stats.total>0)?d:SAMPLE;
    const src=DATA.sample?'sample':'live';
    document.getElementById('meta').textContent=`${src} · ${d.generated||'—'} · APIs ${d.sources_ok||0}/${d.sources_total||4}`;
    if(!DATA.sample) document.getElementById('meta').classList.add('live');
  }catch{DATA=SAMPLE;document.getElementById('meta').textContent='offline · sample data'}
  render();
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected','false'));
  t.setAttribute('aria-selected','true'); TAB=t.dataset.t; render();
}));
document.getElementById('view').addEventListener('click',(e)=>{
  const saveBtn=e.target.closest('[data-save-idx]');
  if(saveBtn){
    const j=TRACK[Number(saveBtn.dataset.saveIdx)];
    if(j) toggleSave(j.title+'|'+j.company,j);
    return;
  }
  const rmBtn=e.target.closest('[data-remove-id]');
  if(rmBtn){ crRemoveFromPipeline(rmBtn.dataset.removeId); updateSavedBadge(); render(); return; }
  if(e.target.closest('#export-btn')){
    const json=crExportSnapshot();
    navigator.clipboard.writeText(json)
      .then(()=>toast('Copied. Paste it to Claude/MClaude to archive.'))
      .catch(()=>toast('Copy failed, check clipboard permissions'));
    render();
    return;
  }
});
document.getElementById('view').addEventListener('change',(e)=>{
  const sel=e.target.closest('[data-status-id]');
  if(sel){ crSetStatus(sel.dataset.statusId, sel.value); render(); }
});
document.getElementById('view').addEventListener('input',(e)=>{
  const note=e.target.closest('[data-note-id]');
  if(note) crSetNote(note.dataset.noteId, note.value);
});
if('serviceWorker'in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
updateSavedBadge();
load();
</script>
</body>
</html>
