name: daily-radar

# Runs in GitHub's cloud (NOT your Walmart Mac, NOT Walmart DNS).
# Aggregates jobs, commits fresh data that the iPhone PWA reads.

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC daily (~07:00 Chile). Adjust as needed.
  workflow_dispatch: {}     # lets you trigger manually from phone (Actions tab -> Run workflow)

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Push must authenticate as Vic (the repo's sole ruleset bypass actor),
          # not the default GITHUB_TOKEN bot identity, or "sealed main" rejects it.
          # Set via: gh secret set RADAR_PAT --repo vicarana/career-radar
          token: ${{ secrets.RADAR_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run radar
        env:
          # Optional. If unset, src_adzuna() skips cleanly (see radar.py).
          # Set via: gh secret set ADZUNA_APP_ID --repo vicarana/career-radar
          #          gh secret set ADZUNA_APP_KEY --repo vicarana/career-radar
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python3 radar/radar.py

      - name: Commit fresh data
        run: |
          git config user.name  "career-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "radar: data $(date -u +%Y-%m-%dT%H:%MZ)"
            # 2026-09-23: run 35879966916 failed here on a transient GitHub
            # "Internal Server Error" from the git backend during push, not
            # anything wrong with this repo or the data (radar.py itself had
            # already finished cleanly, sources_ok 8/8, before the push even
            # started). Confirmed self-resolving: two runs dispatched right
            # after that failure both pushed fine with zero changes here.
            # A couple of retries covers exactly that kind of blip without
            # masking a real, persistent failure (auth/branch-protection
            # issues will still fail all 3 attempts and surface loudly).
            attempt=1
            max_attempts=3
            until git push; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::git push failed after $max_attempts attempts"
                exit 1
              fi
              echo "git push attempt $attempt failed, retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          fi
